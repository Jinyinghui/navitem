services:
  nav-item:
    image: eooce/nav-item
    container_name: nav-item
    ports:
      - "3000:3000"
    environment:
      # 敏感配置从同目录 .env 读取（cp .env.example .env 后填入），切勿把真实值写回本文件
      - PORT=${PORT:-3000}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-123456}
      - JWT_SECRET=${JWT_SECRET:-}
    volumes:
      - ./database:/app/database  # 持久化数据库文件
    restart: always
