<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
    <title>NavItem · 现代化个人导航工作台</title>
    <link rel="icon" type="image/png" href="/default-favicon.png" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      /* 不显示页面滚动条（滚动本身保留：滚轮/触控/键盘照常）。
         否则搜索无结果时页面变矮、滚动条消失，可用宽度多出约 16px，
         所有居中内容会整体右移约 8px，看起来像页面抖了一下。 */
      html, body {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      html::-webkit-scrollbar, body::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }
      body.theme-dark {
        background-color: #0b1120;
        color: #f8fafc;
      }
      body.theme-light {
        background-color: #f1f5f9;
        color: #0f172a;
      }
      .glass-nav {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      body.theme-light .glass-nav {
        background: rgba(255, 255, 255, 0.82);
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      }
      .glass-card {
        background: rgba(30, 41, 59, 0.56);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.16);
        transition: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      }
      body.theme-light .glass-card {
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(15, 23, 42, 0.08);
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
      }
      .glass-card:hover {
        transform: translateY(-4px);
        background: rgba(30, 41, 59, 0.84);
        border-color: rgba(99, 102, 241, 0.48);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(99, 102, 241, 0.25);
      }
      body.theme-light .glass-card:hover {
        background: #ffffff;
        border-color: rgba(99, 102, 241, 0.45);
        box-shadow: 0 12px 28px rgba(99, 102, 241, 0.14);
      }
      .glass-search {
        background: rgba(30, 41, 59, 0.72);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
        transition: all 0.22s ease;
      }
      body.theme-light .glass-search {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(15, 23, 42, 0.1);
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.07);
      }
      .glass-search:focus-within {
        border-color: rgba(99, 102, 241, 0.75);
        box-shadow: 0 12px 36px rgba(99, 102, 241, 0.22), 0 0 0 3px rgba(99, 102, 241, 0.16);
      }
      @keyframes fadeUpIn {
        from { opacity: 0; transform: translateY(12px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .card-anim {
        animation: fadeUpIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .drag-handle {
        cursor: grab;
        user-select: none;
      }
      .drag-handle:active {
        cursor: grabbing;
      }
      .is-dragging {
        opacity: 0.42 !important;
        transform: scale(0.99);
      }
      .is-drag-over {
        border-color: #6366f1 !important;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.35) !important;
        background-color: rgba(99, 102, 241, 0.08) !important;
      }
      .quick-del-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 20px;
        height: 20px;
        border-radius: 9999px;
        background-color: #ef4444;
        color: #ffffff !important;
        font-size: 11px;
        font-weight: 800;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(239, 68, 68, 0.45);
        border: 1.5px solid #ffffff;
        cursor: pointer;
        z-index: 25;
        transition: transform 0.15s ease, background-color 0.15s ease;
      }
      .quick-del-badge:hover {
        background-color: #dc2626;
        transform: scale(1.15);
      }
      .edit-mode-item {
        border-color: rgba(239, 68, 68, 0.4) !important;
      }
      /* Synchronize Admin View & Popovers with Homepage Light/Dark Theme */
      body.theme-light #adminView {
        background-color: rgba(241, 245, 249, 0.92) !important;
        color: #0f172a !important;
      }
      body.theme-light #adminView .bg-slate-950 {
        background-color: #f1f5f9 !important;
        color: #0f172a !important;
      }
      body.theme-light #adminView .bg-slate-950\/70 {
        background-color: #f8fafc !important;
      }
      body.theme-light #adminView .bg-slate-900,
      body.theme-light #adminView .bg-slate-900\/90,
      body.theme-light #adminView .bg-slate-900\/50,
      body.theme-light #adminView .bg-slate-900\/60,
      body.theme-light #adminView .bg-slate-900\/40 {
        background-color: rgba(255, 255, 255, 0.95) !important;
        color: #0f172a !important;
      }
      body.theme-light #adminView .border-slate-800,
      body.theme-light #adminView .border-slate-800\/80,
      body.theme-light #adminView .border-slate-700,
      body.theme-light #adminView .border-slate-700\/80 {
        border-color: #e2e8f0 !important;
      }
      body.theme-light #adminView .divide-slate-800\/70 > :not([hidden]) ~ :not([hidden]) {
        border-color: #e2e8f0 !important;
      }
      body.theme-light #adminView .text-slate-100,
      body.theme-light #adminView .text-slate-200 {
        color: #0f172a !important;
      }
      body.theme-light #adminView .text-slate-300 {
        color: #334155 !important;
      }
      body.theme-light #adminView .text-slate-400 {
        color: #64748b !important;
      }
      body.theme-light #adminView input:not([type="range"]),
      body.theme-light #adminView select {
        background-color: #f8fafc !important;
        border-color: #cbd5e1 !important;
        color: #0f172a !important;
      }
      body.theme-light #adminView input:not([type="range"]):focus,
      body.theme-light #adminView select:focus {
        background-color: #ffffff !important;
        border-color: #6366f1 !important;
      }
      body.theme-light #adminView .bg-slate-800,
      body.theme-light #adminView .bg-slate-800\/60 {
        background-color: #f1f5f9 !important;
        color: #334155 !important;
        border-color: #cbd5e1 !important;
      }
      body.theme-light #adminView .admin-tab-btn:not(.from-indigo-600):hover {
        background-color: #f1f5f9 !important;
        color: #4f46e5 !important;
      }
      body.theme-light #weatherPickerPopover {
        background-color: rgba(255, 255, 255, 0.98) !important;
        border-color: #cbd5e1 !important;
        color: #0f172a !important;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.15) !important;
      }
      body.theme-light #weatherPickerPopover .border-slate-800 {
        border-color: #e2e8f0 !important;
      }
      body.theme-light #weatherPickerPopover .text-slate-200 {
        color: #0f172a !important;
      }
      body.theme-light #weatherPickerPopover input {
        background-color: #f8fafc !important;
        border-color: #cbd5e1 !important;
        color: #0f172a !important;
      }
    </style>
  </head>
  <body class="theme-light min-h-screen flex flex-col relative">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
